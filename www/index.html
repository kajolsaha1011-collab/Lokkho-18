 if(k=='w')due=wkDays(wkS(td()))[6];else if(k=='m')due=ds(new Date(n.getFullYear(),n.getMonth()+1,0));else if(k=='d'){due=v('ld').value;if(!due){alert('একটি তারিখ বাছুন।');return}}
 const o={t:t,note:v('ln').value.trim(),c:v('lc').value,q:+v('lp').value,p:+v('lp').value==3?3:2,due:due,dueT:k=='d'?v('ldt').value:'',goal:v('lg')?v('lg').value:''};

 sh(`<h2>দিন ঠিক করা কাজ</h2><div class="sub">আগামীকালের পরের দিনগুলোর জন্য ঠিক করা · ${bn(F.length)}টি</div>

 ${F.length?`<div class="lsl">${F.map(t=>`<div class="lsr"><span class="lsd" style="background:var(--b)"></span><div class="lsb"><div class="lst">${esc(t.t)}</div><div class="lsm"><span class="lsg">${dl(t.date)}</span><span class="lsu">${t.sl?'⏱ '+slTxt(t.sl):'রুটিনের সময় ঠিক হয়নি'}</span></div></div><div class="lsa"><button class="chip" style="padding:5px 11px;font-size:12px" onclick="lsBack('${t.id}')">জমানো কাজে ফেরত</button><button class="x ed" onclick="VS.push(lsList);qSheet('${t.id}')" aria-label="সম্পাদনা">✎</button><button class="x" onclick="lsDelT('${t.id}')" aria-label="মুছুন">×</button></div></div>`).join('')}</div>`:`<div class="lsei"><b>কোনো কাজ নেই</b>আগামীকালের পরের কোনো দিনের জন্য এখন কাজ ঠিক করা নেই।</div>`}`)}

 <div class="lb st"><i>২</i>রুটিনের কোন সময়ে করবেন?</div><div class="mu hint" style="margin:-2px 0 6px">একটি সময় বাছলেই কাজটি ওই দিনের রুটিনে বসে যাবে।</div>${slotHtml(dt,'lsSlot(','lsCus()',null)}
 <div class="sfoot"><button class="btn s" style="width:100%;min-height:52px" onclick="lsGo(null)">${tmMin(it.dueT)!==null?'আমার দেওয়া সময়েই রাখুন · '+tl(tmMin(it.dueT)):'শুধু দিনটি ঠিক করুন, সময় পরে বাছব'}</button></div>`)}

 if(!sl){const m=tmMin(it.dueT);if(m!==null)sl={bid:null,s:m,e:Math.min(m+30,1439),l:''}}

 toast(dt===td()?'আজকের তালিকায় যোগ হয়েছে':dt===tmD()?'আগামীকালের জন্য ঠিক করা হয়েছে':dl(dt)+'-এর জন্য ঠিক করা হয়েছে')}
